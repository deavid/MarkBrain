---
- name: Build and verify clean static bundle locally, then deploy to VPS
  hosts: markbrain_vps
  become: true
  gather_facts: true
  vars:
    app_dir: /srv/markbrain
    data_dir: /var/lib/markbrain
    config_dir: /etc/markbrain
    rotate_owner_password: false
    markbrain_owner_password_hash: ""
    # Database restore (RUNBOOK §Backups & Restore): a local .sqlite snapshot made
    # by `npm run backup-sqlite`. Empty = normal deploy; set it to restore, e.g.
    #   ansible-playbook -i deploy/ansible/inventory.ini deploy/ansible/playbook.yml \
    #     -e restore_db=/home/you/backups/markbrain-YYYY-MM-DD.sqlite
    restore_db: ""

  tasks:
    - name: 0. Check that the inventory defines a domain
      assert:
        that:
          - markbrain_domain | default('') | length > 0
        fail_msg: >-
          markbrain_domain is not set. Put your domain in the [markbrain_vps:vars]
          section of your inventory (see inventory.ini.example) — the playbook
          writes it into the Caddy config.

    - name: 1. Run local production build + secret guard on dev machine
      delegate_to: localhost
      become: false
      command: npm run build
      args:
        chdir: "{{ playbook_dir }}/../.."

    - name: 2. Ensure required system packages exist on VPS (ffmpeg, sqlite3, rsync)
      apt:
        name:
          - ffmpeg
          - sqlite3
          - rsync
        state: present
        update_cache: true

    - name: 2b. Ensure Node.js and npm exist on the VPS
        #    (the markbrain service runs `npx tsx server.ts`)
      apt:
        name:
          - nodejs
          - npm
        state: present

    - name: 2c. Assert the VPS Node is >= 22.12 (vitest/vite floor; recent Debian
        #    ships 24.x — fails loudly here instead of at service start)
      command: node -v
      changed_when: false
      register: node_version
      failed_when: (node_version.stdout | regex_replace('^v', '')) is not version('22.12.0', '>=')

    - name: 3. Ensure dedicated markbrain system user exists
      user:
        name: markbrain
        system: true
        shell: /usr/sbin/nologin
        home: "{{ data_dir }}"
        create_home: false

    - name: 4. Ensure application, data, and config directories exist
      file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ app_dir }}", owner: "markbrain", group: "markbrain", mode: "0755" }
        - { path: "{{ data_dir }}", owner: "markbrain", group: "markbrain", mode: "0700" }
        - { path: "{{ data_dir }}/tts-cache", owner: "markbrain", group: "markbrain", mode: "0700" }
        - { path: "{{ config_dir }}", owner: "root", group: "markbrain", mode: "0750" }

    - name: 5. Create /etc/markbrain/markbrain.env if missing
      copy:
        dest: "{{ config_dir }}/markbrain.env"
        owner: root
        group: markbrain
        mode: "0640"
        force: false
        content: |
          NODE_ENV=production
          PORT={{ markbrain_port }}
          MARKBRAIN_DB_PATH={{ data_dir }}/markbrain.sqlite
          MARKBRAIN_TTS_CACHE_DIR={{ data_dir }}/tts-cache
          MARKBRAIN_OWNER_EMAIL={{ markbrain_owner_email }}

    - name: 6. Sync dist/, server/, src/, scripts/, and package files to VPS
      synchronize:
        src: "{{ playbook_dir }}/../../"
        dest: "{{ app_dir }}/"
        delete: true
        rsync_path: "sudo rsync"
        rsync_opts:
          - "--include=/dist/***"
          - "--include=/server/***"
          - "--include=/src/***"
          - "--include=/scripts/***"
          - "--include=/package.json"
          - "--include=/server.ts"
          - "--include=/tsconfig.json"
          - "--exclude=*"
      delegate_to: localhost
      become: false

    - name: 7. Install Node dependencies on VPS (dev deps included — tsx runs the
        #    server at runtime; there is no package-lock.json in the repo, bun.lock
        #    is canonical on dev machines, so `npm ci` cannot be used)
      command: npm install --legacy-peer-deps --no-audit --no-fund
      args:
        chdir: "{{ app_dir }}"

    - name: 8a. Ensure secrets directory exists (owner password lives here, never
        #    on the command line or in inventory)
      file:
        path: "{{ config_dir }}/secrets"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: 8b. Write owner password to the server-side secrets file when supplied
      when: markbrain_owner_password | length > 0
      copy:
        dest: "{{ config_dir }}/secrets/owner-password"
        owner: root
        group: root
        mode: "0600"
        content: "{{ markbrain_owner_password }}\n"
      no_log: true

    - name: 8b2. Write owner password HASH to the server-side secrets file when
        #    supplied (hash generated locally with scripts/password-hash.cjs —
        #    the plaintext never leaves the dev machine)
      when: markbrain_owner_password_hash | length > 0
      copy:
        dest: "{{ config_dir }}/secrets/owner-password-hash"
        owner: root
        group: root
        mode: "0600"
        content: "{{ markbrain_owner_password_hash }}\n"
      no_log: true

    - name: 8c. Check for a server-side owner password hash file
      stat:
        path: "{{ config_dir }}/secrets/owner-password-hash"
      register: owner_hash_file

    - name: 8c2. Check for a server-side owner password file
      stat:
        path: "{{ config_dir }}/secrets/owner-password"
      register: owner_password_file

    - name: 8d. Seed Owner Account #1 from the hash file (preferred — plaintext
        #    never crosses anything; idempotent, skipped if the user exists)
      when: owner_hash_file.stat.exists
      shell: >
        npx tsx scripts/user-admin.ts create {{ markbrain_owner_email }}
        --password-hash "$(cat {{ config_dir }}/secrets/owner-password-hash)" --owner
      args:
        chdir: "{{ app_dir }}"
      environment:
        MARKBRAIN_DB_PATH: "{{ data_dir }}/markbrain.sqlite"
      register: seed_owner
      failed_when: seed_owner.rc != 0 and ('already exists' not in seed_owner.stderr)
      no_log: true

    - name: 8d2. Seed Owner Account #1 from the password file (fallback — used when
        #    only a plaintext password was supplied, e.g. rotation)
      when: owner_password_file.stat.exists
      command: >
        npx tsx scripts/user-admin.ts create {{ markbrain_owner_email }}
        --password-file {{ config_dir }}/secrets/owner-password --owner
      args:
        chdir: "{{ app_dir }}"
      environment:
        MARKBRAIN_DB_PATH: "{{ data_dir }}/markbrain.sqlite"
      register: seed_owner
      failed_when: seed_owner.rc != 0 and ('already exists' not in seed_owner.stderr)
      no_log: true

    - name: 8e. Rotate owner password when rotate_owner_password=true (requires a
        #    refreshed markbrain_owner_password to have been written by 8b)
      when:
        - rotate_owner_password | bool
        - markbrain_owner_password | length > 0
      command: >
        npx tsx scripts/user-admin.ts passwd {{ markbrain_owner_email }}
        --password-file {{ config_dir }}/secrets/owner-password
      args:
        chdir: "{{ app_dir }}"
      environment:
        MARKBRAIN_DB_PATH: "{{ data_dir }}/markbrain.sqlite"
      no_log: true

    - name: 8f. Remove the ephemeral plaintext password file — the plaintext
        #    exists on the VPS only in RAM during seed/rotation; the hash file
        #    is the only persistent artifact
      file:
        path: "{{ config_dir }}/secrets/owner-password"
        state: absent

    - name: 9. Fix ownership — data is the app user's; the app dir is root-owned
        #    (audit 26 H3: /srv/markbrain incl. dist/ is served unauthenticated,
        #    so the markbrain user must not be able to write it. tsx only needs
        #    read access; npm install runs as root via become)
      file:
        path: "{{ item.path }}"
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        recurse: true
      loop:
        - { path: "{{ app_dir }}", owner: "root", group: "root" }
        - { path: "{{ data_dir }}", owner: "markbrain", group: "markbrain" }

    - name: 7b. Stop markbrain service before restoring database snapshot (when restore_db is set)
      when: restore_db | length > 0
      systemd:
        name: markbrain
        state: stopped
      failed_when: false

    - name: 7c. Remove stale WAL/SHM files before restoring database snapshot
      when: restore_db | length > 0
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ data_dir }}/markbrain.sqlite-wal"
        - "{{ data_dir }}/markbrain.sqlite-shm"

    - name: 7d. Copy local restore_db snapshot to VPS
      when: restore_db | length > 0
      copy:
        src: "{{ restore_db }}"
        dest: "{{ data_dir }}/markbrain.sqlite"
        owner: markbrain
        group: markbrain
        mode: "0600"

    - name: 10. Install systemd unit
      copy:
        src: "{{ playbook_dir }}/../markbrain.service"
        dest: /etc/systemd/system/markbrain.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart markbrain

    - name: 11. Install Caddy site config (domain/port rendered from inventory)
      template:
        src: "{{ playbook_dir }}/../Caddyfile"
        dest: /etc/caddy/conf.d/markbrain.caddy
        owner: root
        group: root
        mode: "0644"
      notify: Reload caddy

    - name: 12. Ensure markbrain service is enabled and running
      systemd:
        name: markbrain
        daemon_reload: true
        enabled: true
        state: started

    - name: 12b. Restart the service — the old process keeps serving the code it
        #    loaded at startup, so rsynced files stay INERT until restart.
        #    Without this, a deploy ships a new dist/ (Caddy serves it from disk)
        #    while the OLD server keeps answering /api/* from memory: the client
        #    and server drift apart and 'partially working' is exactly what you
        #    see. Unconditional on purpose — an extra restart is cheap and the
        #    vault re-arms from the tab's saved key (design 25).
      systemd:
        name: markbrain
        state: restarted

    - name: 13. Wait for health check on 127.0.0.1:{{ markbrain_port }}/api/health
      uri:
        url: "http://127.0.0.1:{{ markbrain_port }}/api/health"
        status_code: 200
      register: health_res
      retries: 10
      delay: 1
      until: health_res.status == 200

  handlers:
    - name: Restart markbrain
      systemd:
        name: markbrain
        daemon_reload: true
        state: restarted

    - name: Reload caddy
      systemd:
        name: caddy
        state: reloaded
